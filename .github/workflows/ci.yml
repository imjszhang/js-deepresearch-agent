name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test, lint, and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify program contracts without external network
        run: |
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups env PATH="$3" HOME="$5" npm run verify:programmatic -- --output-dir "$4"
          ' verify "$(id -u)" "$(id -g)" "$PATH" "$PWD/work_dir/program-verification" "$HOME"

      - name: Upload safe verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-verification-node-${{ matrix.node }}
          path: work_dir/program-verification/program-verification.json
          if-no-files-found: ignore
